# Demo profile: same algorithms, smaller models / fewer steps / shorter scenes so `make demo`
# finishes in <= 20 min on an 8-core CPU.
inherit: full
profile: demo
sim:
  corpus: {sessions_per_family: 40, bursts_per_session: 320}
tokenizer: {steps: 600, batch: 64, channels: [16, 32, 32, 32], max_train_bursts: 30000}
lm: {d_model: 128, n_layers: 4, n_heads: 4, ctx: 64, warmup: 100, steps: 900, batch: 32, ft_steps: 300}
openset: {cusum_sim_streams: 100, cusum_sim_hours: 1.0}
vaccine:
  n_seq: 200
  adapter_steps: 300
  ddpm: {channels: [16, 32, 48], cond_dim: 64, batch: 32, steps: 300, lora_steps: 100, ddim_steps: 20, n_samples: 600,
         max_train_bursts: 8000}
edge: {student_d: 96, distill_steps: 400, calib_sequences: 128}
eval: {folds: [["P3", "P6"], ["P2", "P5"]], n_seq_per_family: 60}
